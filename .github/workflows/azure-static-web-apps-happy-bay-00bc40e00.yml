name: Azure Static Web Apps CI/CD

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

jobs:
  # ── 1. Quality Gates ────────────────────────────────────────────────────────
  # typecheck → lint → unit tests → audit
  # Runs on every push and every open/updated PR.
  quality:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Quality Gates
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Dependency audit
        run: npm audit --audit-level=high

  # ── 2. Build & E2E (incl. axe) ─────────────────────────────────────────────
  # Builds the static export, then runs Playwright + axe against out/.
  # A separate build here means E2E runs against the real artifact,
  # not the dev server. Depends on quality passing first.
  e2e:
    needs: quality
    runs-on: ubuntu-latest
    name: Build & E2E
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build static export
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E & axe
        run: npm run test:e2e

  # ── 3. Deploy ───────────────────────────────────────────────────────────────
  # Only runs on push to main (not on PRs).
  # Deploys only after both quality and e2e pass.
  deploy:
    needs: e2e
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Deploy to Azure
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build and Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_HAPPY_BAY_00BC40E00 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: /
          api_location: ''
          output_location: out
        env:
          IS_STATIC_EXPORT: true   # tells Oryx to treat this as a Next.js static export

  # ── 4. Close PR preview ─────────────────────────────────────────────────────
  # Cleans up the SWA staging environment when a PR is closed/merged.
  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_HAPPY_BAY_00BC40E00 }}
          action: close
